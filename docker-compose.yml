services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: project-checking-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Pchk_Strong#Pass1"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Pchk_Strong#Pass1' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Pchk_Strong#Pass1' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/ProjectChecking.Api/Dockerfile
    container_name: project-checking-api
    depends_on:
      mssql:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Server=mssql,1433;Database=ProjectChecking;User Id=sa;Password=Pchk_Strong#Pass1;TrustServerCertificate=True;MultipleActiveResultSets=true;"
      Database__AutoMigrate: "true"
    ports:
      - "8080:8080"

volumes:
  mssql_data:
